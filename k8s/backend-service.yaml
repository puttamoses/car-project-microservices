# k8s/backend-service.yaml
# Internal backend service (no external access)

apiVersion: v1
kind: Service

metadata:
  name: car-backend
  namespace: autoelite

spec:
  selector:
    app: car-backend

  type: ClusterIP   # ✅ changed from LoadBalancer (ALB/NLB) to internal service

  ports:
    - port: 80
      targetPort: 5000
      protocol: TCP
