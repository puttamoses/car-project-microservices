# k8s/frontend-service.yaml
apiVersion: v1
kind: Service
metadata:
  name: car-frontend
  namespace: autoelite
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "external"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
    # FIX: was nlb-target-type (NLB annotation) — caused perpetual
    #      EnsuringLoadBalancer loop and <pending> EXTERNAL-IP
    service.beta.kubernetes.io/aws-load-balancer-target-type: "ip"
spec:
  selector:
    app: car-frontend
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
